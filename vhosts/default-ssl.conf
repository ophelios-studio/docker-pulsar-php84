<IfModule mod_ssl.c>
    <VirtualHost *:443>
        # Keep an encoded slash (%2F) in a path and hand it to PHP instead of answering Apache's own 404. Not
        # inherited from the server config: every <VirtualHost> needs its own line.
        AllowEncodedSlashes NoDecode

        ServerAdmin webmaster@localhost
        DocumentRoot /var/www/html/public

        <Directory /var/www/>
            AllowOverride All
            Require all granted
        </Directory>

        SSLEngine on
        SSLCertificateFile /etc/ssl/certs/apache-selfsigned.crt
        SSLCertificateKeyFile /etc/ssl/private/apache-selfsigned.key

        <FilesMatch "\.(cgi|shtml|phtml|php)$">
            SSLOptions +StdEnvVars
        </FilesMatch>

        <Directory /usr/lib/cgi-bin>
            SSLOptions +StdEnvVars
        </Directory>

        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined
        LogFormat "{\"date_time\":\"%{%Y-%m-%d %H:%M:%S}t\", \"execution\": \"%D\", \"remote_address\":\"%a\", \"host\":\"%V\", \"request\":\"%U\", \"query\":\"%q\", \"method\":\"%m\", \"status\":\"%>s\", \"user_agent\":\"%{User-agent}i\", \"referer\":\"%{Referer}i\", \"error\": \"%L\"}" common-json
    </VirtualHost>
</IfModule>